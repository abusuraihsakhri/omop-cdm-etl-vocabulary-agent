[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omop-cdm-etl-vocabulary-engine"
version = "2.0.0"
description = "OMOP-ETL: Observational Medical Outcomes Partnership CDM v5.4 Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.0,<3",
    "uvicorn>=0.24,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
omop-cdm-etl-vocabulary-engine = "omop_cdm_etl.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/omop-cdm-etl-vocabulary-agent"
Repository = "https://github.com/abusuraihsakhri/omop-cdm-etl-vocabulary-agent.git"

[tool.setuptools.packages.find]
include = ["agents*", "omop_cdm_etl*"]
