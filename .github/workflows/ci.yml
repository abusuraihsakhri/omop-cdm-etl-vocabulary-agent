name: Python tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Configure test-only audit key
        run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Python compilation
        run: python -m compileall -q agents omop_cdm_etl cli.py enrichment.py simulator.py
      - name: Run regression tests
        run: python -m pytest -q
      - name: Audit integrity smoke test
        run: |
          python - <<'PY'
          from agents.base import AuditLogger
          AuditLogger.log("ci", "test", "SMOKE", {"status": "PASS"})
          assert AuditLogger.verify_integrity()
          print("Audit integrity check passed")
          PY
